name: Hangar Maestro run
description: Run Maestro flows sharded over fresh simulators on your Hangar, with retries, recordings of failed flows, one JUnit report and one pull request comment.
inputs:
  url:
    description: The Hangar address, such as https://hangar.example.ts.net.
    required: true
  token:
    description: A Hangar token for CI, made on the console's Connect page. Pass it from a secret.
    required: true
  app:
    description: A built simulator .app, an archive of one, or the name of a build already on Hangar. Not used with rerun.
    default: ''
  flows:
    description: The folder with the Maestro flow files.
    default: .maestro
  shards:
    description: How many devices to split the flows over.
    default: '1'
  retries:
    description: How many times to retry a failed flow, recorded.
    default: '1'
  model:
    description: A simulator model, such as iPhone 17. Any model if left out.
    default: ''
  env:
    description: Variables for the flows, one KEY=VALUE per line.
    default: ''
  junit:
    description: Where to write the JUnit report.
    default: hangar-maestro.xml
  rerun:
    description: The id of a finished Hangar run. With rerun-flow, runs that one flow again on a fresh device instead of the whole suite.
    default: ''
  rerun-flow:
    description: The flow to run again, such as login.yaml.
    default: ''
  comment:
    description: Comment on the pull request with the passed, flaky and failed flows, and update that comment on later runs.
    default: 'true'
  comment-key:
    description: Tells comments apart when one job uses the action more than once, such as in a matrix. The workflow and job name are always part of it.
    default: ''
  pr:
    description: The pull request to comment on. The one that started the workflow if left out.
    default: ${{ github.event.pull_request.number }}
  github-token:
    description: The token that writes the comment. It needs pull-requests write permission.
    default: ${{ github.token }}
outputs:
  junit:
    description: The path of the JUnit report.
    value: ${{ inputs.junit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      run: corepack enable && pnpm --dir "$GITHUB_ACTION_PATH" install --frozen-lockfile --prod
    - shell: bash
      env:
        HANGAR_URL: ${{ inputs.url }}
        HANGAR_TOKEN: ${{ inputs.token }}
        HANGAR_COMMENT_KEY: ${{ inputs.comment-key }}
        # Inputs go through the environment, not the script text, so a value cannot run as shell.
        INPUT_FLOWS: ${{ inputs.flows }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_SHARDS: ${{ inputs.shards }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_RERUN: ${{ inputs.rerun }}
        INPUT_RERUN_FLOW: ${{ inputs.rerun-flow }}
        INPUT_COMMENT: ${{ inputs.comment }}
      run: |
        if [ -n "$INPUT_RERUN" ]; then
          args=(run maestro --rerun "$INPUT_RERUN" --flow "$INPUT_RERUN_FLOW" --junit "$INPUT_JUNIT")
        else
          args=(run maestro "$INPUT_FLOWS" --app "$INPUT_APP" --shards "$INPUT_SHARDS" --retries "$INPUT_RETRIES" --junit "$INPUT_JUNIT")
          if [ -n "$INPUT_MODEL" ]; then args+=(--model "$INPUT_MODEL"); fi
        fi
        while IFS= read -r line; do
          if [ -n "$line" ]; then args+=(-e "$line"); fi
        done <<< "$INPUT_ENV"
        comment_file="$RUNNER_TEMP/hangar-comment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
        rm -f "$comment_file"
        if [ "$INPUT_COMMENT" = "true" ]; then export HANGAR_COMMENT_FILE="$comment_file"; fi
        node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/packages/hangar/src/main.ts" "${args[@]}"
    - if: always() && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
      run: |
        body="$RUNNER_TEMP/hangar-comment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
        if ! [[ "$PR" =~ ^[0-9]+$ ]] || [ ! -s "$body" ]; then exit 0; fi
        if ! command -v gh >/dev/null; then
          echo "::warning::Hangar could not comment on the pull request: the GitHub CLI (gh) is not installed on this runner."
          exit 0
        fi
        # The first line of the body is <!-- hangar-run key=<hex> run=<uuid> -->.
        marker=$(head -n 1 "$body")
        key=$(sed -n 's/^<!-- hangar-run key=\([0-9a-f]*\) run=[0-9a-f-]* -->$/\1/p' <<< "$marker")
        run=$(sed -n 's/^<!-- hangar-run key=[0-9a-f]* run=\([0-9a-f-]*\) -->$/\1/p' <<< "$marker")
        if [ -z "$key" ] || [ -z "$run" ]; then exit 0; fi
        # A rerun of a flow finds the comment by its run; a new run of the same job finds it by the key.
        warn() { echo "::warning::Hangar could not comment on pull request #$PR. Check that github-token has pull-requests write permission."; exit 0; }
        comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- hangar-run ")) | "\(.id) \(.body | split("\n")[0])"') || warn
        id=$(grep -F " run=$run " <<< "$comments" | head -n 1 | cut -d' ' -f1 || true)
        if [ -z "$id" ]; then id=$(grep -F " key=$key " <<< "$comments" | head -n 1 | cut -d' ' -f1 || true); fi
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null || warn
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" > /dev/null || warn
        fi
