# Runs every Maestro flow on a pull request with no Devicepool server: the action installs
# Devicepool on the GitHub-hosted macOS runner, starts it, runs the flows on fresh simulators
# and stops it. Copy it to .github/workflows/ in your app's repository and change the build
# steps to match your app. It needs no secrets.
#
# This mode has not run on a real GitHub runner yet. See docs/guides/github-actions.md.
name: e2e

on: [pull_request]

permissions:
  contents: read
  # For the pull request comment. Without it the action prints a warning and goes on.
  pull-requests: write

jobs:
  maestro:
    # macos-26 has 3 cores and 7 GB, which is one simulator. Its default Xcode is the one
    # idb-companion's Homebrew formula asks for.
    runs-on: macos-26
    # Stops a stuck job. A composite action cannot set a timeout of its own.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # A Release build has the JavaScript inside the app, so the flows need no Metro.
      - run: npm ci && npx expo prebuild -p ios
      - run: |
          xcodebuild -workspace ios/MyApp.xcworkspace -scheme MyApp -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ONLY_ACTIVE_ARCH=YES ARCHS=arm64 build
      # No url and no token: Devicepool runs on this runner.
      - uses: mariusud/devicepool@main
        with:
          app: build/Build/Products/Release-iphonesimulator/MyApp.app
          flows: .maestro
          env: |
            TEST_USER=${{ secrets.TEST_USER }}
      # The action uploads the JUnit report, the Devicepool log and the recordings of failed
      # flows itself, as the artifact named devicepool-maestro.
