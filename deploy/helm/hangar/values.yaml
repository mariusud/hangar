# The image built from the Dockerfile at the repository root.
image:
  repository: hangar
  tag: latest
  pullPolicy: IfNotPresent

# The address people and Macs reach Hangar at. Links in the console and the CLI use it.
url: https://hangar.example.com

# SQLite, builds and recordings live on this volume. One replica only: the broker keeps leases
# and runs in its own process.
storage:
  size: 50Gi
  storageClassName: ""

ingress:
  enabled: false
  className: ""
  host: hangar.example.com
  tlsSecretName: ""
  # Agents, live screens and the Metro tunnel hold WebSockets open for hours. For ingress-nginx:
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 4g

resources: {}
